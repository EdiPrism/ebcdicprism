name: Feature Request
description: Suggest a COBOL dialect clause, codepage, export format, or workflow enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Mainframe / Modernization Workflow Problem
      placeholder: Describe the copybook construct, codepage, or binary inspection workflow you want streamlined offline.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
    validations:
      required: true
